apiVersion: apps/v1 
kind: StatefulSet 
metadata:
  name: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: mysql
  replicas: 1
  
  template: 
    metadata:
      labels:
        app: mysql
    spec:
      
      containers:
      - name: mysql-con
        image: mysql:8.0
        ports:
          - containerPort: 3306
        env:
          - name: MYSQL_ROOT_PASSWORD
            value: "rootpassword"
        volumeMounts:
          - name: mysql-data 
            mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "my-storage-class"
      resources:
        requests:
          storage: 1Gi
       